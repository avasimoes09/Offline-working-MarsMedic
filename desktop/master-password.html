<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; script-src 'self'; style-src 'self';">
    <title>M. I. A. Portable Data</title>
    <link rel="stylesheet" href="master-password.css">
  </head>
  <body>
    <main>
      <img src="../public/mia.png" alt="">
      <h1 id="title"></h1>
      <p id="description"></p>
      <form id="master-password-form">
        <label for="master-password">Master password</label>
        <input id="master-password" type="password" minlength="12" maxlength="256" required>
        <div id="confirmation-field" hidden>
          <label for="master-password-confirmation">Confirm master password</label>
          <input id="master-password-confirmation" type="password" minlength="12" maxlength="256" required>
        </div>
        <p id="error-message" role="alert"></p>
        <div class="actions">
          <button id="cancel-button" type="button" class="secondary">Cancel</button>
          <button type="submit">Continue</button>
        </div>
      </form>
      <p class="warning">This is separate from the patient PIN. If you forget this password, encrypted patient data cannot be recovered.</p>
    </main>
    <script src="master-password-renderer.js"></script>
  </body>
</html>
